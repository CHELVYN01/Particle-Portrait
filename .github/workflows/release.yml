name: Release

# Two ways to cut a release:
#   1. Push a tag:   git tag v0.2.0 && git push origin v0.2.0
#   2. GitHub UI:    Actions > Release > Run workflow, then type the version (e.g. v0.2.0).
# Either way the code is type-checked and built first, and a release with
# auto-generated notes (merged PRs and commits since the last release) is published.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.2.0 (add a suffix like -beta.1 for a pre-release)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a valid version tag. Use vMAJOR.MINOR.PATCH, e.g. v0.2.0"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # The tag and package.json must agree, so the site and the release never drift apart.
      - name: Check version matches package.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pkg="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg. Bump package.json, commit, then release."
            exit 1
          fi

      # Runs postinstall, which copies the MediaPipe WASM files the build needs.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists."
            exit 1
          fi
          flags=(--generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # For a tag push the tag already exists; for a manual run it is created on this commit.
          gh release create "$TAG" --target "$GITHUB_SHA" "${flags[@]}"
